[package]
name = "rosorin-bridge"
version = "0.1.0"
edition = "2021"
description = "Low-latency Rust HTTP + WebSocket bridge for Hiwonder ROSOrin Pro (ROS 2 Humble & STM32 1Mbps Serial)"
authors = ["Adrián Catalán <adriancatalan@gmail.com>"]

[dependencies]
axum = { version = "0.7", features = ["ws", "macros"] }
tokio = { version = "1.40", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = "4.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
