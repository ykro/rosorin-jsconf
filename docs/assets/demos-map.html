<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa de los 4 Demos Interactivos de ROSOrin Pro</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #f5f5f5;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .diagram-container {
      width: 100%;
      max-width: 1280px;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="diagram-container">
    <svg viewBox="0 0 1280 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="demos-map-title demos-map-desc" id="demos-map-root">
  <title id="demos-map-title">Mapa de los 4 Demos Interactivos de ROSOrin Pro</title>
  <desc id="demos-map-desc">Progresión de los 4 demos: Demo A Repo Roaster, Demo B CI/CD Gatekeeper, Demo C Spatial Bug Hunter y Demo D Bumblebee Radio con 168 clips bilingües.</desc>
  <defs>
    <style>
      #demos-map-root {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #2d3142;
      }
      .mono {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
      }
    </style>
    <marker id="demos-arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#4f5d75"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- Connectors -->
  <line x1="308" y1="180" x2="348" y2="180" stroke="#4f5d75" stroke-width="2" marker-end="url(#demos-arrow)"/>
  <line x1="620" y1="180" x2="660" y2="180" stroke="#4f5d75" stroke-width="2" marker-end="url(#demos-arrow)"/>
  <line x1="932" y1="180" x2="972" y2="180" stroke="#4f5d75" stroke-width="2" marker-end="url(#demos-arrow)"/>

  <!-- Demo A -->
  <rect x="36" y="64" width="272" height="232" rx="12" fill="#ffffff" stroke="#2d3142" stroke-width="1.4"/>
  <text x="60" y="116" fill="#4f5d75" font-size="16" font-weight="700" class="mono">DEMO A · /roaster</text>
  <text x="60" y="168" fill="#2d3142" font-size="22" font-weight="700">Repo Roaster</text>
  <text x="60" y="212" fill="#4f5d75" font-size="16">Gestos 6-DOF + Voz en vivo</text>

  <!-- Demo B -->
  <rect x="348" y="64" width="272" height="232" rx="12" fill="#ffffff" stroke="#2d3142" stroke-width="1.4"/>
  <text x="372" y="116" fill="#4f5d75" font-size="16" font-weight="700" class="mono">DEMO B · /gatekeeper</text>
  <text x="372" y="168" fill="#2d3142" font-size="22" font-weight="700">CI/CD Gatekeeper</text>
  <text x="372" y="212" fill="#4f5d75" font-size="16">Pinza ID 10 suelta la llave</text>

  <!-- Demo C -->
  <rect x="660" y="64" width="272" height="232" rx="12" fill="#ffffff" stroke="#2e5aa8" stroke-width="1.6"/>
  <text x="684" y="116" fill="#2e5aa8" font-size="16" font-weight="700" class="mono">DEMO C · /bughunter</text>
  <text x="684" y="168" fill="#2d3142" font-size="22" font-weight="700">Spatial Bug Hunter</text>
  <text x="684" y="212" fill="#4f5d75" font-size="16">Strafe Mecanum a 3 tótems</text>

  <!-- Demo D -->
  <rect x="972" y="64" width="272" height="232" rx="12" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.8"/>
  <text x="996" y="116" fill="#eb6c36" font-size="16" font-weight="700" class="mono">DEMO D · /bumblebee</text>
  <text x="996" y="168" fill="#2d3142" font-size="22" font-weight="700">Bumblebee Radio</text>
  <text x="996" y="212" fill="#4f5d75" font-size="16">168 clips (95 ES / 73 EN)</text>
</svg>
  </div>
</body>
</html>
