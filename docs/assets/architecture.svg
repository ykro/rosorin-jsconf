<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rosorin-arch-title rosorin-arch-desc" id="architecture-root">
  <title id="rosorin-arch-title">Arquitectura End-to-End de ROSOrin Pro con Gemini 3.8 Live</title>
  <desc id="rosorin-arch-desc">Flujo de voz bidireccional PCM, llamadas a herramientas no bloqueantes y telemetría a 20 Hz entre el cliente web en Next.js 15, Gemini 3.8 Live, el puente en Rust a 40 Hz y el robot Hiwonder ROSOrin Pro.</desc>
  <defs>
    <style>
      #architecture-root {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #2d3142;
      }
      .mono {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
      }
    </style>
    <marker id="arch-arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#4f5d75"/>
    </marker>
    <marker id="arch-arrow-accent" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#eb6c36"/>
    </marker>
    <marker id="arch-arrow-blue" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#2e5aa8"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- Zones -->
  <rect x="36" y="36" width="360" height="488" rx="12" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.16" stroke-width="1.2"/>
  <text x="64" y="76" fill="#2d3142" font-size="18" font-weight="700">1. Cliente Web (:3000)</text>

  <rect x="460" y="36" width="360" height="488" rx="12" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.16" stroke-width="1.2"/>
  <text x="488" y="76" fill="#2d3142" font-size="18" font-weight="700">2. Cloud AI + Rust (:9000)</text>

  <rect x="884" y="36" width="360" height="488" rx="12" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.16" stroke-width="1.2"/>
  <text x="912" y="76" fill="#2d3142" font-size="18" font-weight="700">3. Robot ROSOrin Pro</text>

  <!-- Connectors -->
  <line x1="368" y1="162" x2="488" y2="162" stroke="#2e5aa8" stroke-width="2" marker-end="url(#arch-arrow-blue)"/>
  <rect x="382" y="128" width="92" height="26" rx="6" fill="#f5f5f5"/>
  <text x="428" y="146" fill="#2e5aa8" font-size="15" font-weight="700" class="mono" text-anchor="middle">16 kHz</text>

  <line x1="488" y1="210" x2="368" y2="210" stroke="#eb6c36" stroke-width="2" marker-end="url(#arch-arrow-accent)"/>
  <rect x="378" y="218" width="100" height="26" rx="6" fill="#f5f5f5"/>
  <text x="428" y="236" fill="#eb6c36" font-size="15" font-weight="700" class="mono" text-anchor="middle">24 kHz</text>

  <path d="M 368,242 H 416 Q 428,242 428,254 V 380 Q 428,392 440,392 H 488" fill="none" stroke="#eb6c36" stroke-width="2" marker-end="url(#arch-arrow-accent)"/>

  <line x1="488" y1="436" x2="368" y2="436" stroke="#4f5d75" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arch-arrow)"/>
  <rect x="380" y="446" width="96" height="26" rx="6" fill="#f5f5f5"/>
  <text x="428" y="464" fill="#4f5d75" font-size="15" font-weight="700" class="mono" text-anchor="middle">WS 20 Hz</text>

  <path d="M 792,392 H 840 Q 852,392 852,380 V 196 Q 852,184 864,184 H 912" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arch-arrow)"/>

  <line x1="1064" y1="262" x2="1064" y2="336" stroke="#eb6c36" stroke-width="2" marker-end="url(#arch-arrow-accent)"/>
  <rect x="1076" y="284" width="108" height="26" rx="6" fill="#f5f5f5"/>
  <text x="1130" y="302" fill="#eb6c36" font-size="15" font-weight="700" class="mono" text-anchor="middle">1 Mbps</text>

  <!-- Nodes -->
  <rect x="64" y="110" width="304" height="152" rx="10" fill="#ffffff" stroke="#2e5aa8" stroke-width="1.6"/>
  <text x="88" y="172" fill="#2d3142" font-size="22" font-weight="700">Cockpit y Voz Web</text>
  <text x="88" y="210" fill="#4f5d75" font-size="16">Next.js 15 + Web Audio PCM</text>

  <rect x="64" y="336" width="304" height="152" rx="10" fill="#ffffff" stroke="#2d3142" stroke-width="1.4"/>
  <text x="88" y="398" fill="#2d3142" font-size="22" font-weight="700">Clon 3D (Three.js)</text>
  <text x="88" y="436" fill="#4f5d75" font-size="16">16 mallas STL a 60 FPS</text>

  <rect x="488" y="110" width="304" height="152" rx="10" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.8"/>
  <text x="512" y="172" fill="#2d3142" font-size="22" font-weight="700">Gemini 3.8 Live</text>
  <text x="512" y="210" fill="#4f5d75" font-size="16">Voz nativa y Tools asíncronos</text>

  <rect x="488" y="336" width="304" height="152" rx="10" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.8"/>
  <text x="512" y="398" fill="#2d3142" font-size="22" font-weight="700">robot-bridge (Rust)</text>
  <text x="512" y="436" fill="#4f5d75" font-size="16">Axum :9000 + Loop a 40 Hz</text>

  <rect x="912" y="110" width="304" height="152" rx="10" fill="#ffffff" stroke="#2d3142" stroke-width="1.4"/>
  <text x="936" y="172" fill="#2d3142" font-size="22" font-weight="700">ROS 2 Humble</text>
  <text x="936" y="210" fill="#4f5d75" font-size="16">Jetson Orin + LiDAR /scan</text>

  <rect x="912" y="336" width="304" height="152" rx="10" fill="#ffffff" stroke="#2d3142" stroke-width="1.4"/>
  <text x="936" y="398" fill="#2d3142" font-size="22" font-weight="700">STM32 + Actuadores</text>
  <text x="936" y="436" fill="#4f5d75" font-size="16">6 Servos (1..5, 10) + Mecanum</text>
</svg>
