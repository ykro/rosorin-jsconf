<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="layers-loops-title layers-loops-desc" id="layers-loops-root">
  <title id="layers-loops-title">Capas del Sistema y Loops Concurrentes en Tiempo Real</title>
  <desc id="layers-loops-desc">Desacoplamiento entre la inferencia multimodal en la nube (~350 ms), la interfaz web (60 FPS), el puente determinista en Rust (40 Hz) y el bus serial del robot (1 Mbps).</desc>
  <defs>
    <style>
      #layers-loops-root {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #2d3142;
      }
      .mono {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
      }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- Left Zone: 4 Layers -->
  <rect x="36" y="36" width="660" height="468" rx="12" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.16" stroke-width="1.2"/>
  <text x="64" y="76" fill="#2d3142" font-size="18" font-weight="700">Arquitectura de 4 Capas</text>

  <!-- Right Zone: Real-Time Loops -->
  <rect x="728" y="36" width="516" height="468" rx="12" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.16" stroke-width="1.2"/>
  <text x="756" y="76" fill="#2d3142" font-size="18" font-weight="700">Loops Deterministas y Seguridad</text>

  <!-- Layer 4 -->
  <rect x="64" y="100" width="604" height="84" rx="10" fill="#ffffff" stroke="#2e5aa8" stroke-width="1.6"/>
  <text x="88" y="138" fill="#2d3142" font-size="20" font-weight="700">Capa 4 · Cloud AI (Gemini 3.8 Live)</text>
  <text x="88" y="166" fill="#4f5d75" font-size="16">Voz PCM 16/24 kHz y Tools (~350 ms)</text>

  <!-- Layer 3 -->
  <rect x="64" y="200" width="604" height="84" rx="10" fill="#ffffff" stroke="#2d3142" stroke-width="1.4"/>
  <text x="88" y="238" fill="#2d3142" font-size="20" font-weight="700">Capa 3 · Cockpit Web (Next.js 15)</text>
  <text x="88" y="266" fill="#4f5d75" font-size="16">Clon 3D Three.js y Barge-In a 60 FPS</text>

  <!-- Layer 2 -->
  <rect x="64" y="300" width="604" height="84" rx="10" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.8"/>
  <text x="88" y="338" fill="#2d3142" font-size="20" font-weight="700">Capa 2 · Puente Rust (rosorin-bridge :9000)</text>
  <text x="88" y="366" fill="#4f5d75" font-size="16">Cinemática a 40 Hz (25 ms) y WS a 20 Hz</text>

  <!-- Layer 1 -->
  <rect x="64" y="400" width="604" height="84" rx="10" fill="#ffffff" stroke="#2d3142" stroke-width="1.4"/>
  <text x="88" y="438" fill="#2d3142" font-size="20" font-weight="700">Capa 1 · Hardware STM32 + ROS 2 Humble</text>
  <text x="88" y="466" fill="#4f5d75" font-size="16">Bus UART 1 Mbps, 6 Servos y LiDAR /scan</text>

  <!-- Right Cards: 4 Loops -->
  <rect x="756" y="100" width="460" height="84" rx="10" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.8"/>
  <text x="780" y="138" fill="#2d3142" font-size="20" font-weight="700">1. Loop Físico (40 Hz / 25 ms)</text>
  <text x="780" y="166" fill="#4f5d75" font-size="16">Interpola servos y watchdog (600 ms)</text>

  <rect x="756" y="200" width="460" height="84" rx="10" fill="#ffffff" stroke="#2d3142" stroke-width="1.4"/>
  <text x="780" y="238" fill="#2d3142" font-size="20" font-weight="700">2. Telemetría WS (20 Hz / 50 ms)</text>
  <text x="780" y="266" fill="#4f5d75" font-size="16">Emite TelemetryState JSON a la web</text>

  <rect x="756" y="300" width="460" height="84" rx="10" fill="#ffffff" stroke="#2d3142" stroke-width="1.4"/>
  <text x="780" y="338" fill="#2d3142" font-size="20" font-weight="700">3. Escudo LiDAR (&lt; 0.28 m)</text>
  <text x="780" y="366" fill="#4f5d75" font-size="16">Frena avance vx &gt; 0 automáticamente</text>

  <rect x="756" y="400" width="460" height="84" rx="10" fill="#ffffff" stroke="#2e5aa8" stroke-width="1.6"/>
  <text x="780" y="438" fill="#2d3142" font-size="20" font-weight="700">4. Compuerta Acústica (1,200 ms)</text>
  <text x="780" y="466" fill="#4f5d75" font-size="16">Silencia el mic al mover los servos</text>
</svg>
