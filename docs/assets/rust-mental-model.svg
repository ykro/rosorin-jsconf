<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rust-mental-model-title rust-mental-model-desc" id="rust-mental-model-root">
  <title id="rust-mental-model-title">Modelo Mental: De Node.js y TypeScript a Rust en robot-bridge</title>
  <desc id="rust-mental-model-desc">Equivalencia directa entre los componentes de un servidor web en Node.js/TypeScript y las primitivas nativas de Axum, Tokio, Arc Mutex y Serde en Rust.</desc>
  <defs>
    <style>
      #rust-mental-model-root {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #2d3142;
      }
      .mono {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
      }
    </style>
    <marker id="rmm-arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#4f5d75"/>
    </marker>
    <marker id="rmm-arrow-accent" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#eb6c36"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- Left Zone: Web Stack -->
  <rect x="36" y="36" width="544" height="452" rx="12" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.16" stroke-width="1.2"/>
  <text x="64" y="76" fill="#2d3142" font-size="18" font-weight="700">Stack Web (Node.js + TypeScript)</text>

  <!-- Right Zone: Rust Stack -->
  <rect x="700" y="36" width="544" height="452" rx="12" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.16" stroke-width="1.2"/>
  <text x="728" y="76" fill="#2d3142" font-size="18" font-weight="700">robot-bridge (Rust + Tokio + Axum :9000)</text>

  <!-- Connectors -->
  <line x1="556" y1="138" x2="724" y2="138" stroke="#4f5d75" stroke-width="2" marker-end="url(#rmm-arrow)"/>
  <line x1="556" y1="234" x2="724" y2="234" stroke="#4f5d75" stroke-width="2" marker-end="url(#rmm-arrow)"/>
  <line x1="556" y1="330" x2="724" y2="330" stroke="#eb6c36" stroke-width="2.2" marker-end="url(#rmm-arrow-accent)"/>
  <line x1="556" y1="426" x2="724" y2="426" stroke="#4f5d75" stroke-width="2" marker-end="url(#rmm-arrow)"/>

  <!-- Row 1 -->
  <rect x="64" y="98" width="492" height="80" rx="10" fill="#ffffff" stroke="#2e5aa8" stroke-width="1.5"/>
  <text x="88" y="134" fill="#2d3142" font-size="20" font-weight="700">Express + ws + Zod</text>
  <text x="88" y="162" fill="#4f5d75" font-size="16">Rutas HTTP/WS y validación runtime</text>

  <rect x="724" y="98" width="492" height="80" rx="10" fill="#ffffff" stroke="#2d3142" stroke-width="1.4"/>
  <text x="748" y="134" fill="#2d3142" font-size="20" font-weight="700">Axum + Serde</text>
  <text x="748" y="162" fill="#4f5d75" font-size="16">Router tipado en puerto :9000</text>

  <!-- Row 2 -->
  <rect x="64" y="194" width="492" height="80" rx="10" fill="#ffffff" stroke="#2e5aa8" stroke-width="1.5"/>
  <text x="88" y="230" fill="#2d3142" font-size="20" font-weight="700">Node.js Event Loop</text>
  <text x="88" y="258" fill="#4f5d75" font-size="16">async/await y timers en un hilo</text>

  <rect x="724" y="194" width="492" height="80" rx="10" fill="#ffffff" stroke="#2d3142" stroke-width="1.4"/>
  <text x="748" y="230" fill="#2d3142" font-size="20" font-weight="700">Tokio Async Runtime</text>
  <text x="748" y="258" fill="#4f5d75" font-size="16">Timers exactos a 40 Hz y 20 Hz</text>

  <!-- Row 3 -->
  <rect x="64" y="290" width="492" height="80" rx="10" fill="#ffffff" stroke="#2e5aa8" stroke-width="1.5"/>
  <text x="88" y="326" fill="#2d3142" font-size="20" font-weight="700">Objeto Global en Memoria</text>
  <text x="88" y="354" fill="#4f5d75" font-size="16">Estado compartido sin lock de hilos</text>

  <rect x="724" y="290" width="492" height="80" rx="10" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.8"/>
  <text x="748" y="326" fill="#2d3142" font-size="20" font-weight="700" class="mono">Arc&lt;Mutex&lt;TelemetryState&gt;&gt;</text>
  <text x="748" y="354" fill="#4f5d75" font-size="16">Acceso seguro garantizado al compilar</text>

  <!-- Row 4 -->
  <rect x="64" y="386" width="492" height="80" rx="10" fill="#ffffff" stroke="#2e5aa8" stroke-width="1.5"/>
  <text x="88" y="422" fill="#2d3142" font-size="20" font-weight="700">Garbage Collector (V8)</text>
  <text x="88" y="450" fill="#4f5d75" font-size="16">Pausas variables de memoria</text>

  <rect x="724" y="386" width="492" height="80" rx="10" fill="#ffffff" stroke="#2d3142" stroke-width="1.4"/>
  <text x="748" y="422" fill="#2d3142" font-size="20" font-weight="700">Ownership y RAII (0 ms GC)</text>
  <text x="748" y="450" fill="#4f5d75" font-size="16">Trayectorias de servos sin jitter</text>
</svg>
