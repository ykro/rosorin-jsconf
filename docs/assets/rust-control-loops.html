<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Los 3 Loops Concurrentes en Tokio y Memoria Compartida</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #f5f5f5;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .diagram-container {
      width: 100%;
      max-width: 1280px;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="diagram-container">
    <svg viewBox="0 0 1280 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rust-control-loops-title rust-control-loops-desc" id="rust-control-loops-root">
  <title id="rust-control-loops-title">Los 3 Loops Concurrentes en Tokio y Memoria Compartida</title>
  <desc id="rust-control-loops-desc">Tres tareas asíncronas en Tokio sincronizan el navegador a 20 Hz, reciben comandos WebSocket/REST y ejecutan la cinemática a 40 Hz sobre Arc Mutex TelemetryState.</desc>
  <defs>
    <style>
      #rust-control-loops-root {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #2d3142;
      }
      .mono {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
      }
    </style>
    <marker id="rcl-arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#4f5d75"/>
    </marker>
    <marker id="rcl-arrow-accent" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#eb6c36"/>
    </marker>
    <marker id="rcl-arrow-blue" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#2e5aa8"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- Zone: Tokio Runtime -->
  <rect x="336" y="36" width="908" height="388" rx="12" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.16" stroke-width="1.2"/>
  <text x="364" y="76" fill="#2d3142" font-size="18" font-weight="700">Tokio Runtime (rosorin-bridge :9000)</text>

  <!-- Connectors -->
  <line x1="284" y1="244" x2="368" y2="244" stroke="#2e5aa8" stroke-width="2" marker-end="url(#rcl-arrow-blue)"/>
  <path d="M 368 136 L 160 136 Q 148 136 148 148 L 148 184" fill="none" stroke="#2e5aa8" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#rcl-arrow-blue)"/>

  <path d="M 880 184 L 880 148 Q 880 136 868 136 L 736 136" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#rcl-arrow)"/>
  <line x1="736" y1="244" x2="800" y2="244" stroke="#eb6c36" stroke-width="2.2" marker-end="url(#rcl-arrow-accent)"/>
  <path d="M 736 352 L 868 352 Q 880 352 880 340 L 880 304" fill="none" stroke="#eb6c36" stroke-width="2.2" marker-end="url(#rcl-arrow-accent)"/>

  <!-- Node 1: Browser -->
  <rect x="36" y="184" width="248" height="120" rx="10" fill="#ffffff" stroke="#2e5aa8" stroke-width="1.6"/>
  <text x="60" y="238" fill="#2d3142" font-size="21" font-weight="700">Cliente Web</text>
  <text x="60" y="274" fill="#4f5d75" font-size="16">Next.js 15 + Three.js</text>

  <!-- Node 2: Task 1 -->
  <rect x="368" y="96" width="368" height="84" rx="10" fill="#ffffff" stroke="#2d3142" stroke-width="1.4"/>
  <text x="392" y="134" fill="#2d3142" font-size="20" font-weight="700">1. Broadcast WS (20 Hz)</text>
  <text x="392" y="162" fill="#4f5d75" font-size="16">Envía snapshot cada 50 ms</text>

  <!-- Node 3: Task 2 -->
  <rect x="368" y="202" width="368" height="84" rx="10" fill="#ffffff" stroke="#2d3142" stroke-width="1.4"/>
  <text x="392" y="240" fill="#2d3142" font-size="20" font-weight="700">2. Receptor REST y WS</text>
  <text x="392" y="268" fill="#4f5d75" font-size="16" class="mono">cmd_vel · gesture · arm · stop</text>

  <!-- Node 4: Task 3 -->
  <rect x="368" y="308" width="368" height="84" rx="10" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.8"/>
  <text x="392" y="346" fill="#2d3142" font-size="20" font-weight="700">3. Loop Físico (40 Hz)</text>
  <text x="392" y="374" fill="#4f5d75" font-size="16">Cinemática y seguridad cada 25 ms</text>

  <!-- Node 5: Shared State -->
  <rect x="800" y="184" width="416" height="120" rx="10" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.8"/>
  <text x="824" y="236" fill="#2d3142" font-size="20" font-weight="700" class="mono">Arc&lt;Mutex&lt;TelemetryState&gt;&gt;</text>
  <text x="824" y="274" fill="#4f5d75" font-size="16">Servos, Odometría y 4 sectores LiDAR</text>
</svg>
  </div>
</body>
</html>
