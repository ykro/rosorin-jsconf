<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="demos-map-title demos-map-desc" id="demos-map-root">
        <title id="demos-map-title">Mapa de los 4 Demos Interactivos de ROSOrin Pro</title>
        <desc id="demos-map-desc">Progresión desde el Demo A (Clon 3D a 20 Hz), Demo B (Escudo LiDAR 360), Demo C (Agente Multimodal Gemini 3.8 Live) hasta el Demo D (Modo Bumblebee Radio con 171 clips bilingües).</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #demos-map-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #demos-map-root { font-family: var(--font-sans); color: var(--color-ink); }
      #demos-map-root .diagram-container { width: 100%; overflow-x: auto; }</style>
          <marker id="demos-map-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Connectors -->
        <line x1="312" y1="224" x2="344" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#demos-map-arrow)"/>
        <line x1="624" y1="224" x2="656" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#demos-map-arrow)"/>
        <line x1="936" y1="224" x2="968" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#demos-map-arrow)"/>

        <!-- Demo A -->
        <rect x="40" y="48" width="272" height="352" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="56" y="68" width="156" height="18" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="134" y="80" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DEMO A · /DEMOS/ROASTER</text>
        <text x="56" y="116" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Repo Roaster</text>
        <text x="56" y="146" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">Analiza un repo de GitHub y</text>
        <text x="56" y="168" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">ejecuta el veredicto con el</text>
        <text x="56" y="190" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">brazo 6-DOF y voz en vivo.</text>
        <line x1="56" y1="216" x2="296" y2="216" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.8"/>
        <text x="56" y="244" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace">• Tool: express_verdict</text>
        <text x="56" y="268" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace">• facepalm / chef_kiss</text>
        <text x="56" y="292" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace">• Q&amp;A continuo por voz</text>
        <text x="56" y="348" fill="#7a8399" font-size="10" font-family="'Geist Mono', monospace">FOCO: Expresión física + Voz</text>

        <!-- Demo B -->
        <rect x="352" y="48" width="272" height="352" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="368" y="68" width="172" height="18" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="454" y="80" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DEMO B · /DEMOS/GATEKEEPER</text>
        <text x="368" y="116" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">CI/CD Gatekeeper</text>
        <text x="368" y="146" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">Custodia la llave física de</text>
        <text x="368" y="168" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">deploy en el Servo ID 10 y</text>
        <text x="368" y="190" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">evalúa Pull Requests reales.</text>
        <line x1="368" y1="216" x2="608" y2="216" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.8"/>
        <text x="368" y="244" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace">• Tool: release_deploy_key</text>
        <text x="368" y="268" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace">• Bandeja verde (J1=680)</text>
        <text x="368" y="292" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace">• Bandeja roja  (J1=260)</text>
        <text x="368" y="348" fill="#7a8399" font-size="10" font-family="'Geist Mono', monospace">FOCO: Manipulación con pinza</text>

        <!-- Demo C -->
        <rect x="664" y="48" width="272" height="352" rx="6" fill="#ffffff" stroke="#2e5aa8" stroke-width="1.2"/>
        <rect x="680" y="68" width="172" height="18" rx="2" fill="none" stroke="#2e5aa8" stroke-opacity="0.50" stroke-width="0.8"/>
        <text x="766" y="80" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DEMO C · /DEMOS/BUGHUNTER</text>
        <text x="680" y="116" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Spatial Bug Hunter</text>
        <text x="680" y="146" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">Se desplaza lateralmente</text>
        <text x="680" y="168" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">(strafe Mecanum) y apunta</text>
        <text x="680" y="190" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">al tótem físico culpable.</text>
        <line x1="680" y1="216" x2="920" y2="216" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.8"/>
        <text x="680" y="244" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace">• point_at_service_totem</text>
        <text x="680" y="268" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace">• Cloud Run / Gemini Live</text>
        <text x="680" y="292" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace">• Firestore (Y = ±20 cm)</text>
        <text x="680" y="348" fill="#2e5aa8" font-size="10" font-family="'Geist Mono', monospace">FOCO: Locomoción espacial</text>

        <!-- Demo D -->
        <rect x="976" y="48" width="264" height="352" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.2"/>
        <rect x="992" y="68" width="172" height="18" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8"/>
        <text x="1078" y="80" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DEMO D · /DEMOS/BUMBLEBEE</text>
        <text x="992" y="116" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Bumblebee Radio Mode</text>
        <text x="992" y="146" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">Conversación continua</text>
        <text x="992" y="168" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">donde el robot baila y</text>
        <text x="992" y="190" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">responde con canciones.</text>
        <line x1="992" y1="216" x2="1224" y2="216" stroke="#eb6c36" stroke-opacity="0.25" stroke-width="0.8"/>
        <text x="992" y="244" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace">• 171 clips EN + ES</text>
        <text x="992" y="268" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace">• 6 bailes bumblebee_*</text>
        <text x="992" y="292" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace">• Estática FM + Jukebox</text>
        <text x="992" y="348" fill="#eb6c36" font-size="10" font-family="'Geist Mono', monospace">FOCO: Personalidad musical</text>

        <!-- Bottom Strip -->
        <line x1="40" y1="436" x2="1240" y2="436" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.8"/>
        <text x="40" y="468" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">VISTAS AUXILIARES</text>
        <text x="172" y="468" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">/robot (Cockpit Unificado)   ·   /face (Ojos expresivos pantalla integrada)   ·   /hud (Teleprompter + Telemetría)</text>
      </svg>
