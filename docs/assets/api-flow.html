<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flujo de la API: herramientas de Gemini, HTTP y WebSocket</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #f5f5f5;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .diagram-container {
      width: 100%;
      max-width: 1280px;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="diagram-container">
    <svg viewBox="0 0 1280 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="api-flow-title api-flow-desc" id="api-flow-root">
  <title id="api-flow-title">Flujo de la API: herramientas de Gemini, HTTP y WebSocket</title>
  <desc id="api-flow-desc">Gemini Live pide una herramienta, el cliente web la ejecuta con un POST con token al bridge en Rust, que aplica límites, freno por eje y E-stop, y el modelo recibe el resultado real (ok o error). La telemetría vuelve por WebSocket a 20 Hz.</desc>
  <defs>
    <style>
      #api-flow-root {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #2d3142;
      }
      .mono {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
      }
    </style>
    <marker id="api-arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#4f5d75"/>
    </marker>
    <marker id="api-arrow-accent" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#eb6c36"/>
    </marker>
    <marker id="api-arrow-blue" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#2e5aa8"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- Zones -->
  <rect x="36" y="36" width="360" height="428" rx="12" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.16" stroke-width="1.2"/>
  <text x="64" y="76" fill="#2d3142" font-size="18" font-weight="700">1. Gemini Live Tools</text>

  <rect x="460" y="36" width="360" height="428" rx="12" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.16" stroke-width="1.2"/>
  <text x="488" y="76" fill="#2d3142" font-size="18" font-weight="700">2. Cliente Web (TS)</text>

  <rect x="884" y="36" width="360" height="428" rx="12" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.16" stroke-width="1.2"/>
  <text x="912" y="76" fill="#2d3142" font-size="18" font-weight="700">3. Bridge en Rust (:9000)</text>

  <!-- Connectors -->
  <line x1="368" y1="176" x2="488" y2="176" stroke="#2e5aa8" stroke-width="2" marker-end="url(#api-arrow-blue)"/>
  <rect x="378" y="140" width="100" height="26" rx="6" fill="#f5f5f5"/>
  <text x="428" y="158" fill="#2e5aa8" font-size="15" font-weight="700" class="mono" text-anchor="middle">ToolCall</text>

  <line x1="488" y1="356" x2="368" y2="356" stroke="#4f5d75" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#api-arrow)"/>
  <rect x="378" y="320" width="100" height="26" rx="6" fill="#f5f5f5"/>
  <text x="428" y="338" fill="#4f5d75" font-size="15" font-weight="700" class="mono" text-anchor="middle">ok / error</text>

  <line x1="792" y1="176" x2="912" y2="176" stroke="#eb6c36" stroke-width="2" marker-end="url(#api-arrow-accent)"/>
  <rect x="802" y="140" width="100" height="26" rx="6" fill="#f5f5f5"/>
  <text x="852" y="158" fill="#eb6c36" font-size="15" font-weight="700" class="mono" text-anchor="middle">HTTP POST</text>

  <line x1="912" y1="356" x2="792" y2="356" stroke="#4f5d75" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#api-arrow)"/>
  <rect x="802" y="320" width="100" height="26" rx="6" fill="#f5f5f5"/>
  <text x="852" y="338" fill="#4f5d75" font-size="15" font-weight="700" class="mono" text-anchor="middle">20 Hz JSON</text>

  <!-- Column 1 -->
  <rect x="64" y="108" width="304" height="136" rx="10" fill="#ffffff" stroke="#2e5aa8" stroke-width="1.6"/>
  <text x="88" y="166" fill="#2d3142" font-size="22" font-weight="700">Function Calls</text>
  <text x="88" y="204" fill="#4f5d75" font-size="16">5 tools físicos y musicales</text>

  <rect x="64" y="288" width="304" height="136" rx="10" fill="#ffffff" stroke="#2d3142" stroke-width="1.4"/>
  <text x="88" y="346" fill="#2d3142" font-size="22" font-weight="700">ToolResponse</text>
  <text x="88" y="384" fill="#4f5d75" font-size="16">Resultado real del bridge</text>

  <!-- Column 2 -->
  <rect x="488" y="108" width="304" height="136" rx="10" fill="#ffffff" stroke="#2d3142" stroke-width="1.4"/>
  <text x="512" y="166" fill="#2d3142" font-size="22" font-weight="700">Cliente HTTP + token</text>
  <text x="512" y="204" fill="#4f5d75" font-size="16" class="mono">/gesture · /cmd_vel · /hud</text>

  <rect x="488" y="288" width="304" height="136" rx="10" fill="#ffffff" stroke="#2d3142" stroke-width="1.4"/>
  <text x="512" y="346" fill="#2d3142" font-size="22" font-weight="700">Stream de Estado</text>
  <text x="512" y="384" fill="#4f5d75" font-size="16" class="mono">WS /ws + GET /status</text>

  <!-- Column 3 -->
  <rect x="912" y="108" width="304" height="136" rx="10" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.8"/>
  <text x="936" y="166" fill="#2d3142" font-size="22" font-weight="700">Guardrails en Rust</text>
  <text x="936" y="204" fill="#4f5d75" font-size="16">Límites, freno por eje, E-stop</text>

  <rect x="912" y="288" width="304" height="136" rx="10" fill="#ffffff" stroke="#2d3142" stroke-width="1.4"/>
  <text x="936" y="346" fill="#2d3142" font-size="22" font-weight="700">TelemetryState</text>
  <text x="936" y="384" fill="#4f5d75" font-size="16">Servos, Odometría y 4 sectores</text>
</svg>
  </div>
</body>
</html>
