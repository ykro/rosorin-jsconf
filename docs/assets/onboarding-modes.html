<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modos de Ejecución · Simulador en Laptop vs Hardware Físico</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2.5rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1280px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Onboarding · Modos de Ejecución</p>
    <h1>Simulador en Laptop vs Conexión a Robot Físico</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="onb-modes-title onb-modes-desc">
        <title id="onb-modes-title">Modos de Ejecución en Laptop y Hardware Físico</title>
        <desc id="onb-modes-desc">Comparación entre el modo simulador en laptop (--mock) y el modo híbrido conectando la laptop al robot físico por Wi-Fi mediante la bandera --robot-ip.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zone 1: Simulador en Laptop -->
        <rect x="40" y="40" width="576" height="404" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <rect x="56" y="44" width="248" height="16" rx="2" fill="#f5f5f5"/>
        <text x="180" y="55" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">MODO 1 · SIMULADOR EN LAPTOP</text>

        <!-- Zone 2: Laptop + Robot Físico -->
        <rect x="664" y="40" width="576" height="404" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <rect x="680" y="44" width="268" height="16" rx="2" fill="#f5f5f5"/>
        <text x="814" y="55" fill="#7a8399" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">MODO 2 · LAPTOP + ROBOT EN WI-FI</text>

        <!-- Connectors Mode 1 -->
        <line x1="288" y1="144" x2="368" y2="144" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="296" y="116" width="64" height="20" rx="4" fill="#f5f5f5"/>
        <text x="328" y="130" fill="#2e5aa8" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">REST</text>

        <line x1="368" y1="196" x2="288" y2="196" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="296" y="204" width="64" height="20" rx="4" fill="#f5f5f5"/>
        <text x="328" y="218" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">WS 20HZ</text>

        <!-- Connectors Mode 2 -->
        <line x1="912" y1="144" x2="992" y2="144" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="920" y="116" width="64" height="20" rx="4" fill="#f5f5f5"/>
        <text x="952" y="130" fill="#eb6c36" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">WI-FI</text>

        <line x1="992" y1="196" x2="912" y2="196" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="920" y="204" width="64" height="20" rx="4" fill="#f5f5f5"/>
        <text x="952" y="218" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">WS 20HZ</text>

        <!-- Nodes Mode 1 -->
        <rect x="64" y="88" width="224" height="160" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="80" y="104" width="112" height="16" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="136" y="115" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOCALHOST:3000</text>
        <text x="80" y="148" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Cockpit + Clon 3D</text>
        <text x="80" y="180" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">Next.js 16 + Three.js</text>
        <text x="80" y="204" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">Demos A, B, C y D</text>
        <text x="80" y="228" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">60 FPS en tu laptop</text>

        <rect x="368" y="88" width="224" height="160" rx="6" fill="rgba(46,90,168,0.06)" stroke="#2e5aa8" stroke-width="1.2"/>
        <rect x="384" y="104" width="112" height="16" rx="2" fill="none" stroke="rgba(46,90,168,0.50)" stroke-width="0.8"/>
        <text x="440" y="115" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOCALHOST:9000</text>
        <text x="384" y="148" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Mock Bridge (Rust)</text>
        <text x="384" y="180" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">--backend mock</text>
        <text x="384" y="204" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">Cinemática + 6 Servos</text>
        <text x="384" y="228" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">Raycasting LiDAR 2D</text>

        <rect x="64" y="280" width="528" height="136" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="84" y="312" fill="#2e5aa8" font-size="11" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.08em">ARRANQUE CON UN COMANDO (SIN ROBOT FÍSICO)</text>
        <text x="84" y="344" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist Mono', monospace">$ ./run.sh --mock</text>
        <text x="84" y="376" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">Compila robot-bridge en tu laptop y levanta http://localhost:3000</text>
        <text x="84" y="398" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">Contrato de API 100% idéntico al robot físico</text>

        <!-- Nodes Mode 2 -->
        <rect x="688" y="88" width="224" height="160" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="704" y="104" width="112" height="16" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="760" y="115" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LAPTOP :3000</text>
        <text x="704" y="148" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Cockpit en Laptop</text>
        <text x="704" y="180" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">Render WebGL pesado</text>
        <text x="704" y="204" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">Sesión Gemini Live</text>
        <text x="704" y="228" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">Libera RAM del Jetson</text>

        <rect x="992" y="88" width="224" height="160" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
        <rect x="1008" y="104" width="128" height="16" rx="2" fill="none" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
        <text x="1072" y="115" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">&lt;ROBOT_IP&gt;:9000</text>
        <text x="1008" y="148" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">ROSOrin Pro</text>
        <text x="1008" y="180" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">--backend serial</text>
        <text x="1008" y="204" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">UART 1 Mbps + ROS 2</text>
        <text x="1008" y="228" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">LiDAR + Cámara real</text>

        <rect x="688" y="280" width="528" height="136" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="708" y="312" fill="#eb6c36" font-size="11" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.08em">CONEXIÓN REMOTA CON BANDERA --robot-ip</text>
        <text x="708" y="344" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist Mono', monospace">$ ./run.sh --robot-ip &lt;IP_DEL_ROBOT&gt;</text>
        <text x="708" y="376" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">Apunta automáticamente el frontend hacia el puente del robot en Wi-Fi</text>
        <text x="708" y="398" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">En el Jetson del robot ejecuta: ./run.sh (o ./run.sh --lite)</text>

        <!-- Legend -->
        <line x1="40" y1="472" x2="1240" y2="472" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <text x="40" y="504" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEYENDA</text>
        <line x1="128" y1="500" x2="160" y2="500" stroke="#2e5aa8" stroke-width="1.2"/>
        <text x="172" y="504" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Comandos REST Locales (localhost:9000)</text>
        <line x1="464" y1="500" x2="496" y2="500" stroke="#eb6c36" stroke-width="1.2"/>
        <text x="508" y="504" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Comandos REST en Red Wi-Fi (--robot-ip)</text>
        <line x1="812" y1="500" x2="844" y2="500" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
        <text x="856" y="504" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Stream WebSocket 20 Hz + LiDAR + Cámara</text>
      </svg>
    </div>
  </div>
</body>
</html>
