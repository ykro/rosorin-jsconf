<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modos de Ejecución en Laptop y Hardware Físico</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #f5f5f5;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .diagram-container {
      width: 100%;
      max-width: 1280px;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="diagram-container">
    <svg viewBox="0 0 1280 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="onb-modes-title onb-modes-desc" id="onboarding-modes-root">
  <title id="onb-modes-title">Modos de Ejecución en Laptop y Hardware Físico</title>
  <desc id="onb-modes-desc">Modo 1: web y bridge mock en la laptop (localhost:3000 y localhost:9000, sin token). Modo 2: la web corre en la laptop y manda comandos por Wi-Fi al bridge del robot en IP:9000 con el token que genera make robot.</desc>
  <defs>
    <style>
      #onboarding-modes-root {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #2d3142;
      }
      .mono {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
      }
    </style>
    <marker id="onb-arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#4f5d75"/>
    </marker>
    <marker id="onb-arrow-accent" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#eb6c36"/>
    </marker>
    <marker id="onb-arrow-blue" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#2e5aa8"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- Zone 1 -->
  <rect x="36" y="36" width="580" height="408" rx="12" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.16" stroke-width="1.2"/>
  <text x="64" y="76" fill="#2d3142" font-size="18" font-weight="700">Modo 1 · Simulador en Laptop</text>

  <!-- Zone 2 -->
  <rect x="664" y="36" width="580" height="408" rx="12" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.16" stroke-width="1.2"/>
  <text x="692" y="76" fill="#2d3142" font-size="18" font-weight="700">Modo 2 · Laptop + Robot en Wi-Fi</text>

  <!-- Arrows Mode 1 -->
  <line x1="296" y1="162" x2="356" y2="162" stroke="#2e5aa8" stroke-width="2" marker-end="url(#onb-arrow-blue)"/>
  <line x1="356" y1="198" x2="296" y2="198" stroke="#4f5d75" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#onb-arrow)"/>

  <!-- Arrows Mode 2 -->
  <line x1="924" y1="162" x2="984" y2="162" stroke="#eb6c36" stroke-width="2" marker-end="url(#onb-arrow-accent)"/>
  <line x1="984" y1="198" x2="924" y2="198" stroke="#4f5d75" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#onb-arrow)"/>

  <!-- Mode 1 Boxes -->
  <rect x="64" y="106" width="232" height="144" rx="10" fill="#ffffff" stroke="#2d3142" stroke-width="1.4"/>
  <text x="84" y="164" fill="#2d3142" font-size="21" font-weight="700">Web + gemelo 3D</text>
  <text x="84" y="202" fill="#4f5d75" font-size="16" class="mono">localhost:3000</text>

  <rect x="356" y="106" width="232" height="144" rx="10" fill="#ffffff" stroke="#2e5aa8" stroke-width="1.6"/>
  <text x="376" y="164" fill="#2d3142" font-size="21" font-weight="700">Bridge mock</text>
  <text x="376" y="202" fill="#2e5aa8" font-size="16" class="mono">localhost:9000</text>

  <rect x="64" y="280" width="524" height="132" rx="10" fill="#ffffff" stroke="#2d3142" stroke-width="1.4"/>
  <text x="88" y="336" fill="#2d3142" font-size="22" font-weight="700" class="mono">$ ./run.sh --mock</text>
  <text x="88" y="376" fill="#4f5d75" font-size="16">Todo en tu laptop: sin robot y sin token</text>

  <!-- Mode 2 Boxes -->
  <rect x="692" y="106" width="232" height="144" rx="10" fill="#ffffff" stroke="#2d3142" stroke-width="1.4"/>
  <text x="712" y="164" fill="#2d3142" font-size="21" font-weight="700">Web en Laptop</text>
  <text x="712" y="202" fill="#4f5d75" font-size="16" class="mono">localhost:3000</text>

  <rect x="984" y="106" width="232" height="144" rx="10" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.8"/>
  <text x="1004" y="164" fill="#2d3142" font-size="21" font-weight="700">ROSOrin Pro</text>
  <text x="1004" y="202" fill="#eb6c36" font-size="16" class="mono">&lt;IP&gt;:9000 + token</text>

  <rect x="692" y="280" width="524" height="132" rx="10" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.8"/>
  <text x="716" y="336" fill="#2d3142" font-size="22" font-weight="700" class="mono">$ ./run.sh --robot-ip &lt;IP&gt;</text>
  <text x="716" y="376" fill="#4f5d75" font-size="16">Con el .bridge-token del robot (make robot)</text>
</svg>
  </div>
</body>
</html>
